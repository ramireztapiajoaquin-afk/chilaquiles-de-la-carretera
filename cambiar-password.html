<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cambiar contraseña</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#111713;color:#211d18;font-family:system-ui,Segoe UI,sans-serif}.hidden{display:none!important}.page{min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(460px,100%);background:#fff;padding:28px;border-radius:22px;box-shadow:0 18px 55px #0006}h1{margin:0 0 8px}.sub{color:#625b51;margin:0 0 20px}.field{width:100%;padding:14px;margin:6px 0;border:1px solid #d9d0c4;border-radius:12px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:9px;background:#176c44;color:#fff;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.message{margin-top:14px;padding:12px;border-radius:11px;background:#ffe1dc;color:#8b2119}.ok{background:#e5f5e9;color:#176c44}.rules{background:#f5f1ea;padding:13px;border-radius:11px;font-size:13px;line-height:1.55}.user{background:#edf6f0;color:#176c44;padding:11px;border-radius:10px;font-weight:800;margin-bottom:12px}.link{display:block;text-align:center;margin-top:15px;color:#176c44}
  </style>
</head>
<body>
  <main class="page">
    <section id="loginBox" class="box">
      <h1>🔐 Seguridad</h1>
      <p class="sub">Inicie sesión para cambiar su propia contraseña.</p>
      <input id="email" class="field" type="email" autocomplete="username" placeholder="Correo">
      <input id="currentPassword" class="field" type="password" autocomplete="current-password" placeholder="Contraseña actual">
      <button id="enter" class="btn">CONTINUAR</button>
      <div id="loginMessage"></div>
    </section>

    <section id="changeBox" class="box hidden">
      <h1>Nueva contraseña</h1>
      <div id="signedUser" class="user"></div>
      <div class="rules">Use por lo menos 12 caracteres, incluyendo una mayúscula, una minúscula, un número y un símbolo como <b>!</b>, <b>#</b> o <b>$</b>.</div>
      <input id="newPassword" class="field" type="password" autocomplete="new-password" placeholder="Nueva contraseña">
      <input id="confirmPassword" class="field" type="password" autocomplete="new-password" placeholder="Repita la nueva contraseña">
      <button id="save" class="btn">GUARDAR NUEVA CONTRASEÑA</button>
      <div id="changeMessage"></div>
      <a class="link" href="#" id="cancel">Cancelar y salir</a>
    </section>
  </main>

  <script>
    const client=supabase.createClient('https://wufftcheeyznuaymplyf.supabase.co','sb_publishable_1OgzXVDtS7aKSICG58Owtg_er1PKy2O');
    const el=id=>document.getElementById(id);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const show=(id,text,ok=false)=>{el(id).innerHTML='<div class="message '+(ok?'ok':'')+'">'+esc(text)+'</div>'};

    async function enter(){
      el('loginMessage').innerHTML='';el('enter').disabled=true;el('enter').textContent='VERIFICANDO…';
      try{
        await client.auth.signOut();
        const email=el('email').value.trim();
        const {data,error}=await client.auth.signInWithPassword({email,password:el('currentPassword').value});
        if(error)throw new Error('Correo o contraseña actual incorrectos.');
        const {data:staff,error:staffError}=await client.from('meseros').select('id,activo').eq('user_id',data.user.id).eq('activo',true).maybeSingle();
        if(staffError||!staff)throw new Error('Esta cuenta no pertenece al personal activo.');
        el('signedUser').textContent='Cuenta: '+email;
        el('loginBox').classList.add('hidden');el('changeBox').classList.remove('hidden');
      }catch(e){await client.auth.signOut();show('loginMessage',e.message)}
      finally{el('enter').disabled=false;el('enter').textContent='CONTINUAR'}
    }

    function strong(p){return p.length>=12&&/[a-z]/.test(p)&&/[A-Z]/.test(p)&&/[0-9]/.test(p)&&/[^A-Za-z0-9]/.test(p)}
    async function save(){
      el('changeMessage').innerHTML='';const password=el('newPassword').value,confirm=el('confirmPassword').value;
      if(!strong(password)){show('changeMessage','La contraseña no cumple todos los requisitos.');return}
      if(password!==confirm){show('changeMessage','Las dos contraseñas no coinciden.');return}
      el('save').disabled=true;el('save').textContent='GUARDANDO…';
      try{
        const {error}=await client.auth.updateUser({password});if(error)throw error;
        await client.auth.signOut();
        el('newPassword').value='';el('confirmPassword').value='';
        show('changeMessage','Contraseña cambiada correctamente. Ya puede cerrar esta página.',true);
        el('save').classList.add('hidden');el('cancel').textContent='Volver al inicio';
      }catch(e){show('changeMessage','No se pudo cambiar: '+e.message);el('save').disabled=false;el('save').textContent='GUARDAR NUEVA CONTRASEÑA'}
    }

    el('enter').onclick=enter;el('currentPassword').onkeydown=e=>{if(e.key==='Enter')enter()};el('save').onclick=save;
    el('cancel').onclick=async e=>{e.preventDefault();await client.auth.signOut();location.reload()};
  </script>
</body>
</html>
