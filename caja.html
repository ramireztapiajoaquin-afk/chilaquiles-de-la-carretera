<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caja e Historial · Chilaquiles de la Carretera</title><style>
:root{--green:#176c44;--gold:#e0ad22;--red:#ad291e;--ink:#201c18;--muted:#756d64;--line:#e6ddd1;--cream:#f6f1e8}*{box-sizing:border-box}body{margin:0;background:#f1eee8;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.hidden{display:none!important}button,input{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#17271f,#0c0d0c)}.login-card{width:min(430px,100%);padding:28px;background:#fffaf2;border-radius:24px;box-shadow:0 25px 70px #0008}.login-card h1{margin:0;color:var(--green)}.field{width:100%;padding:14px;border:2px solid var(--line);border-radius:13px;margin:7px 0}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:900;cursor:pointer}.login-btn{width:100%;margin-top:8px;background:var(--green);color:#fff}.status{margin-top:10px;padding:10px;background:#ffe1dc;color:#8c2119;border-radius:10px}.top{position:sticky;top:0;z-index:10;background:#141613;color:#fff}.top-in{max-width:1200px;margin:auto;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand strong,.brand small{display:block}.brand small{color:#d0d3ce}.top .btn{background:#ffffff1d;color:white;padding:8px 11px}.wrap{max-width:1200px;margin:auto;padding:18px 14px 70px}.filters{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:15px}.filters label{font-size:12px;font-weight:900;color:var(--muted)}.filters input{display:block;margin-top:5px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.refresh{background:var(--green);color:#fff}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 8px 22px #3322110b}.metric b{display:block;font-size:25px;color:var(--green)}.metric span{font-size:11px;color:var(--muted);font-weight:900}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:auto;box-shadow:0 10px 30px #33221110}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line)}th{background:#25251f;color:#fff;font-size:12px}td{font-size:14px}.amount{font-weight:950;color:var(--green)}.method{padding:5px 8px;border-radius:999px;background:#e7f4ec;color:#176c44;font-size:11px;font-weight:900;text-transform:uppercase}.ticket{background:#eee6d8;color:#4c4034;padding:7px 9px}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.metric:first-child{grid-column:1/-1}.brand small{display:none}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:80mm;padding:7mm;background:#fff}.no-print{display:none!important}}
</style></head><body>
<section id="loginView" class="login"><div class="login-card"><h1>💰 Panel de Caja</h1><p>Ventas, cobros e historial del restaurante.</p><input id="email" class="field" type="email" autocomplete="username" placeholder="Correo"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="loginBtn" class="btn login-btn">ENTRAR A CAJA</button><div id="loginStatus"></div></div></section>
<main id="appView" class="hidden"><header class="top"><div class="top-in"><div class="brand"><strong>💰 CAJA · <span id="restaurantName">Restaurante</span></strong><small>Historial y corte de ventas</small></div><button id="logoutBtn" class="btn">Salir</button></div></header><div class="wrap"><div class="filters no-print"><label>FECHA<input id="dateFilter" type="date"></label><button id="refreshBtn" class="btn refresh">ACTUALIZAR</button><button class="btn ticket" onclick="printCut()">🖨️ IMPRIMIR CORTE</button></div><section class="metrics"><div class="metric"><b id="salesTotal">$0</b><span>VENTA TOTAL</span></div><div class="metric"><b id="orderCount">0</b><span>PEDIDOS COBRADOS</span></div><div class="metric"><b id="cashTotal">$0</b><span>EFECTIVO</span></div><div class="metric"><b id="cardTotal">$0</b><span>TARJETA</span></div><div class="metric"><b id="transferTotal">$0</b><span>TRANSFERENCIA</span></div></section><div class="table-wrap"><table><thead><tr><th>HORA</th><th>MESA</th><th>FOLIO</th><th>MESERO</th><th>FORMA DE PAGO</th><th>TOTAL</th><th>TICKET</th></tr></thead><tbody id="salesRows"></tbody></table><div id="empty" class="empty hidden">No hay pedidos cobrados en esta fecha.</div></div></div></main>
<section id="printArea" class="hidden"></section>
<script src="config.js?v=16"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared.js?v=16"></script><script>
let sb=null,profile=null,restaurant=null,sales=[],saleItems=[];const $=id=>document.getElementById(id),safe=s=>eh(s),cash=v=>'$'+Number(v||0).toFixed(2);
function showStatus(t){$('loginStatus').innerHTML=`<div class="status">${safe(t)}</div>`}function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dayRange(v){const a=new Date(v+'T00:00:00'),b=new Date(v+'T23:59:59.999');return[a.toISOString(),b.toISOString()]}
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return showStatus('Escribe correo y contraseña.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return showStatus('No se pudo iniciar sesión: '+error.message);enter()}
async function enter(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:m,error}=await sb.from('meseros').select('*').eq('user_id',user.id).eq('activo',true).maybeSingle();if(error||!m){await sb.auth.signOut();return showStatus('Este usuario no está autorizado.')}if(!['caja','admin'].includes(m.rol||'')){await sb.auth.signOut();return showStatus('Esta cuenta no tiene acceso al panel de caja.')}profile=m;const {data:r}=await sb.from('restaurants').select('*').eq('id',m.restaurant_id).single();restaurant=r;$('restaurantName').textContent=r?.name||'Chilaquiles de la Carretera';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');loadSales()}
async function loadSales(){const [from,to]=dayRange($('dateFilter').value);const {data,error}=await sb.from('pedidos').select('*').eq('restaurant_id',profile.restaurant_id).eq('estado','cobrado').gte('cobrado_at',from).lte('cobrado_at',to).order('cobrado_at',{ascending:false});if(error){alert('No se pudo cargar caja: '+error.message);return}sales=data||[];saleItems=[];if(sales.length){const {data:i}=await sb.from('pedido_items').select('*').in('pedido_id',sales.map(s=>s.id));saleItems=i||[]}render()}
function sum(method){return sales.filter(s=>!method||s.forma_pago===method).reduce((a,s)=>a+Number(s.total||0),0)}function render(){$('salesTotal').textContent=cash(sum());$('orderCount').textContent=sales.length;$('cashTotal').textContent=cash(sum('efectivo'));$('cardTotal').textContent=cash(sum('tarjeta'));$('transferTotal').textContent=cash(sum('transferencia'));$('salesRows').innerHTML=sales.map(s=>`<tr><td>${new Date(s.cobrado_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</td><td><b>${safe(s.numero_mesa)}</b></td><td>${safe(String(s.id).slice(0,8).toUpperCase())}</td><td>${safe(s.mesero_id===profile.id?(profile.nombre||'Mesero'):'Equipo')}</td><td><span class="method">${safe(s.forma_pago||'Sin registrar')}</span></td><td class="amount">${cash(s.total)}</td><td><button class="btn ticket" onclick="printTicket('${s.id}')">IMPRIMIR</button></td></tr>`).join('');$('empty').classList.toggle('hidden',sales.length>0)}
function printTicket(id){const s=sales.find(x=>x.id===id),its=saleItems.filter(i=>i.pedido_id===id);$('printArea').innerHTML=`<div style="text-align:center"><h2>${safe(restaurant?.name||'Restaurante')}</h2><p>Ticket de consumo</p></div><hr><p><b>Mesa:</b> ${safe(s.numero_mesa)}<br><b>Folio:</b> ${safe(String(s.id).slice(0,8).toUpperCase())}<br><b>Fecha:</b> ${new Date(s.cobrado_at).toLocaleString('es-MX')}<br><b>Pago:</b> ${safe((s.forma_pago||'').toUpperCase())}</p><hr>${its.map(i=>`<div style="display:flex;justify-content:space-between"><span>${Number(i.cantidad)}× ${safe(i.producto)}</span><b>${cash(Number(i.cantidad)*Number(i.precio))}</b></div>`).join('')}<hr><h2 style="display:flex;justify-content:space-between"><span>TOTAL</span><span>${cash(s.total)}</span></h2><p style="text-align:center">¡Gracias por su preferencia!</p>`;$('printArea').classList.remove('hidden');window.print();setTimeout(()=>$('printArea').classList.add('hidden'),300)}
function printCut(){$('printArea').innerHTML=`<div style="text-align:center"><h2>${safe(restaurant?.name||'Restaurante')}</h2><p>Corte de caja · ${safe($('dateFilter').value)}</p></div><hr><p>Pedidos cobrados: <b>${sales.length}</b></p><p>Efectivo: <b>${cash(sum('efectivo'))}</b><br>Tarjeta: <b>${cash(sum('tarjeta'))}</b><br>Transferencia: <b>${cash(sum('transferencia'))}</b></p><hr><h2>Total: ${cash(sum())}</h2>`;$('printArea').classList.remove('hidden');window.print();setTimeout(()=>$('printArea').classList.add('hidden'),300)}
async function logout(){await sb.auth.signOut();location.reload()}async function boot(){if(!cfgReady())return showStatus('Configuración incompleta.');sb=makeClient();$('dateFilter').value=localDate();$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('refreshBtn').onclick=loadSales;$('logoutBtn').onclick=logout;const {data:{session}}=await sb.auth.getSession();if(session)enter()}boot();
</script></body></html>
