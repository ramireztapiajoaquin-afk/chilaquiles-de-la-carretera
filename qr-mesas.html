<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR de Mesas · Chilaquiles de la Carretera</title>
<style>*{box-sizing:border-box}body{margin:0;background:#ece8df;color:#251d16;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.toolbar{position:sticky;top:0;z-index:10;background:#16120f;color:#fff;padding:12px;text-align:center}.toolbar button{border:0;border-radius:11px;padding:11px 18px;background:#d43b28;color:#fff;font-weight:950;cursor:pointer}.intro{max-width:900px;margin:20px auto 10px;padding:0 18px;text-align:center}.intro h1{margin-bottom:4px;color:#a51f16}.grid{max-width:900px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:#fffdf7;border:3px solid #231d17;border-radius:22px;padding:20px;text-align:center;break-inside:avoid;box-shadow:0 10px 30px #2e21151b}.card h2{font-size:30px;margin:5px;color:#ad251a}.card p{margin:6px;color:#665c51;font-weight:750}.qr{width:220px;height:220px;margin:14px auto;padding:10px;background:#fff;border:1px solid #ddd;display:grid;place-items:center}.qr canvas{max-width:100%;height:auto}.logo{font-size:20px;font-weight:1000}.url{font-size:10px;word-break:break-all;color:#8c8278}.cut{margin-top:10px;border-top:1px dashed #aaa;padding-top:9px;font-size:11px;color:#777}@media(max-width:650px){.grid{grid-template-columns:1fr}.qr{width:200px;height:200px}}@media print{@page{size:letter;margin:8mm}body{background:#fff}.toolbar,.intro p{display:none}.intro{margin:0}.intro h1{font-size:18px}.grid{grid-template-columns:repeat(2,1fr);gap:7mm;padding:3mm}.card{box-shadow:none;border-width:2px;padding:9mm}.qr{width:43mm;height:43mm;margin:4mm auto}.card h2{font-size:22px}.cut{display:none}}</style></head><body>
<div class="toolbar"><button onclick="window.print()">🖨️ IMPRIMIR LOS 5 CÓDIGOS QR</button></div><div class="intro"><h1>🌶️ Chilaquiles de la Carretera</h1><p>Imprime, recorta y coloca cada código en la mesa correspondiente.</p></div><main id="grid" class="grid"></main>
<script>const grid=document.getElementById('grid');for(let table=1;table<=5;table++){const url=`https://chilaquilesdisenorestaurantepremium-three.vercel.app/?mesa=${table}`,card=document.createElement('article');card.className='card';card.innerHTML=`<div class="logo">🌶️ CHILAQUILES DE LA CARRETERA</div><h2>MESA ${table}</h2><p>Escanea para ver el menú y ordenar</p><div class="qr"><img src="qr-mesa-${table}.png" width="210" height="210" alt="QR Mesa ${table}"></div><div class="url">${url}</div><div class="cut">Código exclusivo para la Mesa ${table}</div>`;grid.appendChild(card)}</script></body></html>
