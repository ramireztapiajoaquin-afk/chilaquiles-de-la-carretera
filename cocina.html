<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Cocina · Chilaquiles de la Carretera</title>
<style>
:root{--red:#b42119;--orange:#e66a18;--green:#238557;--ink:#251d17;--cream:#f7f0e3;--line:#e6d9c7}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#24130f,#080706 42%);color:var(--ink);min-height:100vh}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(430px,100%);background:#fffaf2;border-radius:24px;padding:26px;box-shadow:0 28px 80px #0008}.login-card h1{margin:0;color:var(--red)}.login-card p{color:#756b60}.field{width:100%;border:2px solid var(--line);border-radius:13px;padding:14px;margin:7px 0;font:inherit;outline:none}.field:focus{border-color:var(--orange)}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:950;cursor:pointer}.login-btn{width:100%;margin-top:10px;background:linear-gradient(135deg,var(--red),#7f120d);color:white}.status{margin-top:12px;padding:11px;border-radius:10px;background:#ffe5e1;color:#9d2119;font-weight:800}
.top{position:sticky;top:0;z-index:20;background:#15100deF;color:white;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff20}.top-inner{max-width:1500px;margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand strong,.brand small{display:block}.brand strong{font-size:20px}.brand small{color:#dacfc3;margin-top:2px}.live{color:#67e5a7;font-weight:900}.logout{background:#ffffff18;color:white;padding:9px 12px}
.summary{max-width:1500px;margin:16px auto 0;padding:0 18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fffaf2;border-radius:16px;padding:14px 16px;border:1px solid #ffffff66}.stat b{font-size:26px;color:var(--red)}.stat span{display:block;color:#71665a;font-weight:800;font-size:12px;text-transform:uppercase}
.board{max-width:1500px;margin:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px;align-items:start}.ticket{background:#fffaf2;border-radius:18px;overflow:hidden;border:3px solid var(--orange);box-shadow:0 14px 35px #0005}.ticket.prep{border-color:#d9a20a}.ticket.ready{border-color:var(--green);opacity:.86}.ticket-head{padding:14px 16px;background:#fff1dc;display:flex;justify-content:space-between;align-items:flex-start}.ticket.prep .ticket-head{background:#fff6cd}.ticket.ready .ticket-head{background:#daf4e7}.table{font-size:25px;font-weight:1000;color:var(--red)}.meta{font-size:12px;color:#76695c;font-weight:800;margin-top:3px}.timer{background:#2b211b;color:white;border-radius:10px;padding:8px 9px;font-weight:950;font-variant-numeric:tabular-nums}.ticket.late .timer{background:#b42119;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.06)}}
.items{list-style:none;margin:0;padding:13px 16px}.items li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #d9cbb9;font-size:16px}.qty{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:#2a211c;color:white;margin-right:7px}.notes{margin:0 16px 12px;padding:11px;border-radius:11px;background:#ffe1d9;color:#8f251d}.actions{padding:0 16px 16px}.prep-btn{width:100%;background:linear-gradient(135deg,#e66a18,#bd3a10);color:white}.ready-btn{width:100%;background:linear-gradient(135deg,#d7a40d,#9b7200);color:white}.done-label{text-align:center;color:var(--green);font-weight:1000;padding:8px}.empty{grid-column:1/-1;background:#fffaf2;border-radius:18px;padding:40px;text-align:center;color:#75695d;font-weight:900}
@media(max-width:700px){.summary{grid-template-columns:repeat(3,1fr);gap:7px;padding:0 9px}.stat{padding:10px}.stat b{font-size:21px}.board{padding:10px;grid-template-columns:1fr}.brand strong{font-size:16px}.live{font-size:12px}}
</style></head><body>
<section id="loginView" class="login">
  <div class="login-card"><h1>👨‍🍳 Panel de Cocina</h1><p>Inicia sesión con un usuario activo del restaurante.</p>
    <input id="email" class="field" type="email" autocomplete="username" placeholder="Correo">
    <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Contraseña">
    <button id="loginBtn" class="btn login-btn">ENTRAR A COCINA</button><div id="loginStatus"></div>
  </div>
</section>
<main id="appView" class="hidden">
  <header class="top"><div class="top-inner"><div class="brand"><strong>👨‍🍳 COCINA · <span id="restaurantName">Restaurante</span></strong><small>Producción de pedidos en tiempo real</small></div><div><span id="connection">Conectando…</span> <button id="logoutBtn" class="btn logout">Salir</button></div></div></header>
  <section class="summary"><div class="stat"><b id="acceptedCount">0</b><span>Por preparar</span></div><div class="stat"><b id="prepCount">0</b><span>En preparación</span></div><div class="stat"><b id="readyCount">0</b><span>Listos</span></div></section>
  <section id="board" class="board"></section>
</main>
<script src="config.js?v=15"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared.js?v=15"></script>
<script>
let sb=null,userProfile=null,orders=[],items=[],channel=null,audioReady=false;
const $=id=>document.getElementById(id),safe=s=>eh(s);
function status(text){$('loginStatus').innerHTML=`<div class="status">${safe(text)}</div>`}
function elapsed(iso){const ms=Math.max(0,Date.now()-new Date(iso).getTime()),m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function enableAudio(){audioReady=true}
function alarm(){if(!audioReady)return;try{const AC=window.AudioContext||window.webkitAudioContext,c=new AC(),o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(740,c.currentTime);o.frequency.setValueAtTime(940,c.currentTime+.18);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.14,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.45);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.46)}catch(e){}if(navigator.vibrate)navigator.vibrate([160,80,160])}
async function login(){enableAudio();const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return status('Escribe correo y contraseña.');$('loginBtn').disabled=true;const {error}=await sb.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;if(error)return status('No se pudo iniciar sesión: '+error.message);enter()}
async function enter(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:m,error}=await sb.from('meseros').select('*').eq('user_id',user.id).eq('activo',true).maybeSingle();if(error||!m){await sb.auth.signOut();return status('Este usuario no está autorizado para el restaurante.')}userProfile=m;const {data:r}=await sb.from('restaurants').select('name').eq('id',m.restaurant_id).single();$('restaurantName').textContent=r?.name||'Chilaquiles de la Carretera';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await refresh(false);subscribe()}
async function refresh(play=false){const previous=new Set(orders.filter(o=>o.estado==='aceptado').map(o=>o.id));const {data:o,error}=await sb.from('pedidos').select('*').eq('restaurant_id',userProfile.restaurant_id).in('estado',['aceptado','en_preparacion','listo']).order('created_at');if(error){console.error(error);return}orders=o||[];items=[];if(orders.length){const {data:i}=await sb.from('pedido_items').select('*').in('pedido_id',orders.map(o=>o.id)).order('created_at');items=i||[]}if(play&&orders.some(o=>o.estado==='aceptado'&&!previous.has(o.id)))alarm();render()}
function card(o){const its=items.filter(i=>i.pedido_id===o.id),mins=Math.floor((Date.now()-new Date(o.created_at))/60000),cls=o.estado==='en_preparacion'?'prep':o.estado==='listo'?'ready':'';let action=o.estado==='aceptado'?`<button class="btn prep-btn" onclick="setState('${o.id}','en_preparacion')">🔥 EN PREPARACIÓN</button>`:o.estado==='en_preparacion'?`<button class="btn ready-btn" onclick="setState('${o.id}','listo')">✅ MARCAR LISTO</button>`:`<div class="done-label">✓ LISTO PARA ENTREGAR</div>`;return `<article class="ticket ${cls} ${mins>=20?'late':''}"><div class="ticket-head"><div><div class="table">MESA ${safe(o.numero_mesa)}</div><div class="meta">${new Date(o.created_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="timer" data-created="${safe(o.created_at)}">${elapsed(o.created_at)}</div></div><ul class="items">${its.map(i=>`<li><span><b class="qty">${Number(i.cantidad||1)}×</b>${safe(i.producto)}</span></li>`).join('')}</ul>${o.observaciones?`<div class="notes"><b>INDICACIONES:</b> ${safe(o.observaciones)}</div>`:''}<div class="actions">${action}</div></article>`}
function render(){$('acceptedCount').textContent=orders.filter(o=>o.estado==='aceptado').length;$('prepCount').textContent=orders.filter(o=>o.estado==='en_preparacion').length;$('readyCount').textContent=orders.filter(o=>o.estado==='listo').length;$('board').innerHTML=orders.length?orders.map(card).join(''):'<div class="empty">👨‍🍳 No hay pedidos pendientes en cocina.</div>'}
async function setState(id,state){const {error}=await sb.from('pedidos').update({estado:state,updated_at:new Date().toISOString()}).eq('id',id).eq('restaurant_id',userProfile.restaurant_id);if(error)return alert('No se pudo actualizar: '+error.message);refresh(false)}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('cocina-'+userProfile.restaurant_id).on('postgres_changes',{event:'*',schema:'public',table:'pedidos',filter:`restaurant_id=eq.${userProfile.restaurant_id}`},()=>refresh(true)).on('postgres_changes',{event:'*',schema:'public',table:'pedido_items'},()=>refresh(false)).subscribe(s=>{$('connection').textContent=s==='SUBSCRIBED'?'● En tiempo real':'Conectando…';$('connection').classList.toggle('live',s==='SUBSCRIBED')})}
async function logout(){if(channel)await sb.removeChannel(channel);await sb.auth.signOut();location.reload()}
async function boot(){if(!cfgReady())return status('Configuración incompleta.');sb=makeClient();$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').onclick=logout;document.addEventListener('pointerdown',enableAudio,{once:true});const {data:{session}}=await sb.auth.getSession();if(session)enter()}
setInterval(()=>document.querySelectorAll('[data-created]').forEach(x=>x.textContent=elapsed(x.dataset.created)),1000);boot();
</script></body></html>
