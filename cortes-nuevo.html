<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortes de Caja</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3efe7;color:#211d18;font-family:system-ui,Segoe UI,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#121713}.login-box{width:min(430px,100%);background:#fff;padding:27px;border-radius:22px}.field{width:100%;margin:6px 0;padding:14px;border:1px solid #ddd3c5;border-radius:12px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:900;cursor:pointer}.green{background:#176c44;color:#fff}.wide{width:100%}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#ffe1dc;color:#8b2119;font-weight:800}.top{background:#171914;color:#fff;padding:14px}.topin,.wrap{max-width:1150px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center}.wrap{padding:18px 14px}.filters{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.filters label{font-size:11px;font-weight:900}.filters input,.filters select{display:block;padding:10px;margin-top:4px;border:1px solid #ddd3c5;border-radius:10px}.period{padding:10px;background:#fff0c6;border-radius:10px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:16px 0}.metric{background:#fff;border-radius:15px;padding:14px}.metric b{display:block;font-size:24px;color:#176c44}.metric span{font-size:10px;font-weight:900;color:#746b61}.tablebox{overflow:auto;background:#fff;border-radius:15px}table{width:100%;min-width:650px;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5ddd1;text-align:left}th{background:#252720;color:#fff}.empty{text-align:center;padding:30px}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.metric:first-child{grid-column:1/-1}}@media print{.noprint{display:none}.login{display:none}.metrics{grid-template-columns:repeat(5,1fr)}}
</style></head><body>
<section id="login" class="login"><div class="login-box"><h1>📊 Cortes de Caja</h1><p>Acceso para Caja y Administración.</p><input id="email" class="field" type="email" placeholder="Correo"><input id="password" class="field" type="password" placeholder="Contraseña"><button id="enter" class="btn green wide" type="button">ENTRAR</button><div id="message"></div></div></section>
<main id="app" class="hidden"><header class="top"><div class="topin"><div><b>📊 CORTES · <span id="restaurant">Restaurante</span></b></div><button id="exit" class="btn noprint">Salir</button></div></header><div class="wrap"><div class="filters noprint"><label>TIPO<select id="period"><option value="day">Diario</option><option value="week">Semanal</option><option value="month">Mensual</option></select></label><label>FECHA<input id="date" type="date"></label><button id="refresh" class="btn green">ACTUALIZAR</button><button class="btn" onclick="print()">IMPRIMIR</button><span id="periodText" class="period"></span></div><h2 id="title"></h2><section class="metrics"><div class="metric"><b id="total">$0</b><span>VENTA TOTAL</span></div><div class="metric"><b id="orders">0</b><span>PEDIDOS</span></div><div class="metric"><b id="cash">$0</b><span>EFECTIVO</span></div><div class="metric"><b id="cards">$0</b><span>TARJETA</span></div><div class="metric"><b id="transfers">$0</b><span>TRANSFERENCIA</span></div></section><div class="tablebox"><table><thead><tr><th>FECHA</th><th>MESA</th><th>FOLIO</th><th>PAGO</th><th>TOTAL</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">No hay ventas en este periodo.</div></div></div></main>
<script>
const client=supabase.createClient('https://wufftcheeyznuaymplyf.supabase.co','sb_publishable_1OgzXVDtS7aKSICG58Owtg_er1PKy2O');const el=id=>document.getElementById(id);let staff=null,sales=[];const money=n=>'$'+Number(n||0).toFixed(2),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function message(t){el('message').innerHTML='<div class="msg">'+escapeHtml(t)+'</div>'}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function signIn(){el('enter').disabled=true;el('enter').textContent='ENTRANDO…';message('Verificando cuenta…');try{const email=el('email').value.trim(),password=el('password').value;if(!email||!password)throw new Error('Escribe correo y contraseña.');const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;await openApp()}catch(e){message('No se pudo entrar: '+e.message)}finally{el('enter').disabled=false;el('enter').textContent='ENTRAR'}}
async function openApp(){const {data:{user},error:uerr}=await client.auth.getUser();if(uerr||!user)throw new Error(uerr?.message||'Sesión no encontrada.');const {data:m,error:merr}=await client.from('meseros').select('*').eq('user_id',user.id).eq('activo',true).maybeSingle();if(merr)throw merr;if(!m||!['caja','admin'].includes(m.rol||'')){await client.auth.signOut();throw new Error('La cuenta no tiene permiso de Caja o Administración.')}staff=m;const {data:r}=await client.from('restaurants').select('name').eq('id',m.restaurant_id).single();el('restaurant').textContent=r?.name||'Restaurante';el('login').classList.add('hidden');el('app').classList.remove('hidden');await load()}
function getRange(){const mode=el('period').value,a=new Date(el('date').value+'T00:00:00'),b=new Date(el('date').value+'T23:59:59.999');if(mode==='week'){const n=(a.getDay()+6)%7;a.setDate(a.getDate()-n);a.setHours(0,0,0,0);b.setTime(a.getTime());b.setDate(b.getDate()+6);b.setHours(23,59,59,999)}else if(mode==='month'){a.setDate(1);a.setHours(0,0,0,0);b.setFullYear(a.getFullYear(),a.getMonth()+1,0);b.setHours(23,59,59,999)}const kind=mode==='day'?'Corte diario':mode==='week'?'Corte semanal':'Corte mensual',fmt=d=>d.toLocaleDateString('es-MX');return[a.toISOString(),b.toISOString(),mode==='day'?kind+' · '+fmt(a):kind+' · '+fmt(a)+' al '+fmt(b)]}
async function load(){const[from,to,label]=getRange();el('periodText').textContent=label;el('title').textContent=label;const{data,error}=await client.from('pedidos').select('*').eq('restaurant_id',staff.restaurant_id).eq('estado','cobrado').gte('cobrado_at',from).lte('cobrado_at',to).order('cobrado_at',{ascending:false});if(error)return alert(error.message);sales=data||[];render()}
function sum(type){return sales.filter(x=>!type||x.forma_pago===type).reduce((a,x)=>a+Number(x.total||0),0)}function render(){el('total').textContent=money(sum());el('orders').textContent=sales.length;el('cash').textContent=money(sum('efectivo'));el('cards').textContent=money(sum('tarjeta'));el('transfers').textContent=money(sum('transferencia'));el('rows').innerHTML=sales.map(x=>'<tr><td>'+new Date(x.cobrado_at).toLocaleString('es-MX')+'</td><td>'+escapeHtml(x.numero_mesa)+'</td><td>'+String(x.id).slice(0,8).toUpperCase()+'</td><td>'+escapeHtml((x.forma_pago||'Sin registrar').toUpperCase())+'</td><td><b>'+money(x.total)+'</b></td></tr>').join('');el('empty').classList.toggle('hidden',sales.length>0)}
el('date').value=today();el('enter').addEventListener('click',signIn);el('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});el('refresh').addEventListener('click',load);el('period').addEventListener('change',load);el('date').addEventListener('change',load);el('exit').addEventListener('click',async()=>{await client.auth.signOut();location.reload()});client.auth.getSession().then(({data})=>{if(data.session)openApp().catch(async e=>{await client.auth.signOut();message(e.message)})});
</script></body></html>
