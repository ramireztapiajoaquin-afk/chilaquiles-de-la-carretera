<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cortes de Caja · Chilaquiles de la Carretera</title><style>
:root{--green:#176c44;--ink:#211d18;--muted:#746b61;--line:#e3dbcf;--cream:#f3efe7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#121713}.card{width:min(430px,100%);background:#fff;padding:26px;border-radius:22px}.field{width:100%;padding:14px;margin:6px 0;border:1px solid var(--line);border-radius:12px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:#fff}.login .primary{width:100%}.status{margin-top:10px;padding:10px;background:#ffe2dd;color:#8b2119;border-radius:10px}.top{background:#171914;color:#fff;padding:13px 16px}.top-in{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center}.top small{display:block;color:#cfd3cb}.top .btn{background:#ffffff1a;color:#fff}.wrap{max-width:1150px;margin:auto;padding:18px 14px 70px}.filters{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin-bottom:15px}.filters label{font-size:11px;font-weight:900;color:var(--muted)}.filters input,.filters select{display:block;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.period{padding:10px 13px;border-radius:10px;background:#fff1c9;color:#70520a;font-size:12px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.metric b{display:block;font-size:24px;color:var(--green)}.metric span{font-size:10px;color:var(--muted);font-weight:900}.table{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:690px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left}th{background:#23251f;color:#fff;font-size:11px}td{font-size:13px}.amount{font-weight:950;color:var(--green)}.empty{text-align:center;padding:30px;color:var(--muted)}
@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.metric:first-child{grid-column:1/-1}}
@media print{@page{size:letter;margin:12mm}.no-print{display:none!important}.top{background:#fff;color:#000}.wrap{padding:10px}.table{overflow:visible}.metrics{grid-template-columns:repeat(5,1fr)}body{background:#fff}}
</style></head><body>
<section id="loginView" class="login"><div class="card"><h1>📊 Cortes de Caja</h1><p>Acceso para Caja y Administración.</p><input id="email" class="field" type="email" autocomplete="username" placeholder="Correo"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Contraseña"><button id="loginBtn" class="btn primary" type="button" onclick="login()">ENTRAR</button><div id="loginStatus"></div></div></section>
<main id="appView" class="hidden"><header class="top"><div class="top-in"><div><strong>📊 CORTES · <span id="restaurantName">Restaurante</span></strong><small>Diario, semanal y mensual</small></div><button id="logoutBtn" class="btn no-print">Salir</button></div></header><div class="wrap"><div class="filters no-print"><label>TIPO<select id="period"><option value="daily">Diario</option><option value="weekly">Semanal</option><option value="monthly">Mensual</option></select></label><label>FECHA DE REFERENCIA<input id="date" type="date"></label><button id="refresh" class="btn primary">ACTUALIZAR</button><button class="btn" onclick="window.print()">🖨️ IMPRIMIR</button><span id="label" class="period"></span></div><h2 id="printTitle"></h2><section class="metrics"><div class="metric"><b id="total">$0</b><span>VENTA TOTAL</span></div><div class="metric"><b id="count">0</b><span>PEDIDOS</span></div><div class="metric"><b id="cash">$0</b><span>EFECTIVO</span></div><div class="metric"><b id="cardTotal">$0</b><span>TARJETA</span></div><div class="metric"><b id="transfer">$0</b><span>TRANSFERENCIA</span></div></section><div class="table"><table><thead><tr><th>FECHA Y HORA</th><th>MESA</th><th>FOLIO</th><th>PAGO</th><th>TOTAL</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">No hay ventas cobradas en este periodo.</div></div></div></main>
<script src="config.js?v=18"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="shared.js?v=18"></script><script>
let sb=null,profile=null,sales=[];const $=id=>document.getElementById(id),safe=s=>eh(s),money=v=>'$'+Number(v||0).toFixed(2);
function localDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function range(){const mode=$('period').value,a=new Date($('date').value+'T00:00:00'),b=new Date($('date').value+'T23:59:59.999');if(mode==='weekly'){const offset=(a.getDay()+6)%7;a.setDate(a.getDate()-offset);a.setHours(0,0,0,0);b.setTime(a.getTime());b.setDate(b.getDate()+6);b.setHours(23,59,59,999)}else if(mode==='monthly'){a.setDate(1);a.setHours(0,0,0,0);b.setFullYear(a.getFullYear(),a.getMonth()+1,0);b.setHours(23,59,59,999)}const type=mode==='daily'?'Corte diario':mode==='weekly'?'Corte semanal':'Corte mensual',fmt=d=>d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}),label=mode==='daily'?`${type} · ${fmt(a)}`:`${type} · ${fmt(a)} al ${fmt(b)}`;return[a.toISOString(),b.toISOString(),label]}
function status(t){$('loginStatus').innerHTML=`<div class="status">${safe(t)}</div>`}async function login(){try{sb=sb||makeClient();const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return status('Escribe correo y contraseña.');$('loginBtn').disabled=true;$('loginBtn').textContent='ENTRANDO…';const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await enter()}catch(e){status('No se pudo entrar: '+e.message)}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='ENTRAR'}}
async function enter(){const {data:{user},error:userError}=await sb.auth.getUser();if(userError||!user)throw new Error(userError?.message||'No se encontró la sesión.');const {data:m,error:roleError}=await sb.from('meseros').select('*').eq('user_id',user.id).eq('activo',true).maybeSingle();if(roleError)throw new Error('Error de permisos: '+roleError.message);if(!m||!['caja','admin'].includes(m.rol||'')){await sb.auth.signOut();throw new Error('Esta cuenta no tiene acceso a Cortes.')}profile=m;const {data:r}=await sb.from('restaurants').select('name').eq('id',m.restaurant_id).single();$('restaurantName').textContent=r?.name||'Restaurante';$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await load()}
async function load(){const [from,to,label]=range();$('label').textContent=label;$('printTitle').textContent=label;const {data,error}=await sb.from('pedidos').select('*').eq('restaurant_id',profile.restaurant_id).eq('estado','cobrado').gte('cobrado_at',from).lte('cobrado_at',to).order('cobrado_at',{ascending:false});if(error)return alert(error.message);sales=data||[];render()}
function sum(method){return sales.filter(x=>!method||x.forma_pago===method).reduce((a,x)=>a+Number(x.total||0),0)}function render(){$('total').textContent=money(sum());$('count').textContent=sales.length;$('cash').textContent=money(sum('efectivo'));$('cardTotal').textContent=money(sum('tarjeta'));$('transfer').textContent=money(sum('transferencia'));$('rows').innerHTML=sales.map(x=>`<tr><td>${new Date(x.cobrado_at).toLocaleString('es-MX')}</td><td>${safe(x.numero_mesa)}</td><td>${safe(String(x.id).slice(0,8).toUpperCase())}</td><td>${safe((x.forma_pago||'Sin registrar').toUpperCase())}</td><td class="amount">${money(x.total)}</td></tr>`).join('');$('empty').classList.toggle('hidden',sales.length>0)}
async function logout(){await sb.auth.signOut();location.reload()}async function boot(){if(!cfgReady())return status('Configuración incompleta.');sb=makeClient();$('date').value=localDate();$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('refresh').onclick=load;$('period').onchange=load;$('date').onchange=load;$('logoutBtn').onclick=logout;const {data:{session}}=await sb.auth.getSession();if(session)enter().catch(async e=>{await sb.auth.signOut();status('No se pudo abrir la sesión: '+e.message)})}boot();
</script></body></html>
