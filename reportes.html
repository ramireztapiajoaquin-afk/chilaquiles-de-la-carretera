<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reportes de Ventas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f2eee6;color:#211d18;font-family:system-ui,Segoe UI,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#111713}.box{width:min(430px,100%);background:#fff;padding:27px;border-radius:22px}.field{width:100%;margin:6px 0;padding:14px;border:1px solid #ddd3c5;border-radius:12px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:900;cursor:pointer}.green{background:#176c44;color:#fff}.wide{width:100%}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#ffe1dc;color:#8b2119;font-weight:800}.top{background:#171914;color:#fff;padding:14px}.topin,.wrap{max-width:1180px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center}.wrap{padding:18px 14px 70px}.filters{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.filters label{font-size:11px;font-weight:900}.filters input,.filters select{display:block;padding:10px;margin-top:4px;border:1px solid #ddd3c5;border-radius:10px}.period{padding:10px;background:#fff0c6;border-radius:10px;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.metric{background:#fff;border-radius:15px;padding:14px;border:1px solid #e4dccf}.metric b{display:block;font-size:24px;color:#176c44}.metric span{font-size:10px;color:#746b61;font-weight:900}.content{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.panel{background:#fff;border-radius:16px;border:1px solid #e4dccf;overflow:hidden}.panel h3{margin:0;padding:14px;background:#24261f;color:#fff}.tablebox{overflow:auto}table{width:100%;min-width:640px;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5ddd1;text-align:left}th{font-size:11px;color:#6f665c}.rank{font-weight:950;color:#176c44}.amount{font-weight:950}.bars{padding:14px}.bar-row{margin-bottom:14px}.bar-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:850;margin-bottom:5px}.bar-track{height:13px;background:#e9e4da;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#176c44,#42a56f);border-radius:999px;min-width:3px}.empty{text-align:center;padding:30px;color:#746b61}@media(max-width:780px){.metrics{grid-template-columns:repeat(2,1fr)}.content{grid-template-columns:1fr}}@media print{.noprint,.login{display:none!important}.top{background:#fff;color:#000}.wrap{padding:8px}.content{grid-template-columns:1fr}.panel{break-inside:avoid}.metrics{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<section id="login" class="login"><div class="box"><h1>📈 Reportes de Ventas</h1><p>Acceso para Caja y Administración.</p><input id="email" class="field" type="email" placeholder="Correo"><input id="password" class="field" type="password" placeholder="Contraseña"><button id="enter" class="btn green wide">ENTRAR</button><div id="message"></div></div></section>
<main id="app" class="hidden"><header class="top"><div class="topin"><b>📈 REPORTES · <span id="restaurant">Restaurante</span></b><button id="exit" class="btn noprint">Salir</button></div></header><div class="wrap"><div class="filters noprint"><label>PERIODO<select id="period"><option value="day">Diario</option><option value="week">Semanal</option><option value="month">Mensual</option></select></label><label>FECHA<input id="date" type="date"></label><button id="refresh" class="btn green">ACTUALIZAR</button><button class="btn" onclick="print()">🖨️ IMPRIMIR</button><span id="periodText" class="period"></span></div><h2 id="title"></h2><section class="metrics"><div class="metric"><b id="revenue">$0</b><span>INGRESOS</span></div><div class="metric"><b id="units">0</b><span>UNIDADES VENDIDAS</span></div><div class="metric"><b id="products">0</b><span>PRODUCTOS DIFERENTES</span></div><div class="metric"><b id="average">$0</b><span>TICKET PROMEDIO</span></div></section><section class="content"><div class="panel"><h3>Ranking de productos</h3><div class="tablebox"><table><thead><tr><th>#</th><th>PRODUCTO</th><th>UNIDADES</th><th>INGRESOS</th><th>% VENTA</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">No hay productos vendidos en este periodo.</div></div></div><div class="panel"><h3>Más vendidos</h3><div id="bars" class="bars"></div></div></section></div></main>
<script>
const client=supabase.createClient('https://wufftcheeyznuaymplyf.supabase.co','sb_publishable_1OgzXVDtS7aKSICG58Owtg_er1PKy2O');const el=id=>document.getElementById(id);let staff=null,orders=[],items=[],report=[];const money=n=>'$'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(t){el('message').innerHTML='<div class="msg">'+esc(t)+'</div>'}function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function range(){const mode=el('period').value,a=new Date(el('date').value+'T00:00:00'),b=new Date(el('date').value+'T23:59:59.999');if(mode==='week'){const n=(a.getDay()+6)%7;a.setDate(a.getDate()-n);a.setHours(0,0,0,0);b.setTime(a.getTime());b.setDate(b.getDate()+6);b.setHours(23,59,59,999)}else if(mode==='month'){a.setDate(1);a.setHours(0,0,0,0);b.setFullYear(a.getFullYear(),a.getMonth()+1,0);b.setHours(23,59,59,999)}const type=mode==='day'?'Reporte diario':mode==='week'?'Reporte semanal':'Reporte mensual',fmt=d=>d.toLocaleDateString('es-MX');return[a.toISOString(),b.toISOString(),mode==='day'?type+' · '+fmt(a):type+' · '+fmt(a)+' al '+fmt(b)]}
async function signIn(){el('enter').disabled=true;el('enter').textContent='ENTRANDO…';msg('Verificando cuenta…');try{const{error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)throw error;await openApp()}catch(e){msg('No se pudo entrar: '+e.message)}finally{el('enter').disabled=false;el('enter').textContent='ENTRAR'}}
async function openApp(){const{data:{user}}=await client.auth.getUser();if(!user)throw new Error('Sesión no encontrada.');const{data:m,error}=await client.from('meseros').select('*').eq('user_id',user.id).eq('activo',true).maybeSingle();if(error)throw error;if(!m||!['caja','admin'].includes(m.rol||'')){await client.auth.signOut();throw new Error('La cuenta no tiene acceso a Reportes.')}staff=m;const{data:r}=await client.from('restaurants').select('name').eq('id',m.restaurant_id).single();el('restaurant').textContent=r?.name||'Restaurante';el('login').classList.add('hidden');el('app').classList.remove('hidden');await load()}
async function load(){const[from,to,label]=range();el('periodText').textContent=label;el('title').textContent=label;const{data:o,error}=await client.from('pedidos').select('id,total').eq('restaurant_id',staff.restaurant_id).eq('estado','cobrado').gte('cobrado_at',from).lte('cobrado_at',to);if(error)return alert(error.message);orders=o||[];items=[];if(orders.length){const{data:i,error:ie}=await client.from('pedido_items').select('*').in('pedido_id',orders.map(x=>x.id));if(ie)return alert(ie.message);items=i||[]}build()}
function build(){const map=new Map();for(const i of items){const name=i.producto||'Sin nombre',qty=Number(i.cantidad||0),income=qty*Number(i.precio||0),x=map.get(name)||{name,qty:0,income:0};x.qty+=qty;x.income+=income;map.set(name,x)}report=[...map.values()].sort((a,b)=>b.qty-a.qty||b.income-a.income);render()}
function render(){const revenue=orders.reduce((a,x)=>a+Number(x.total||0),0),units=report.reduce((a,x)=>a+x.qty,0),max=Math.max(1,...report.map(x=>x.qty));el('revenue').textContent=money(revenue);el('units').textContent=units;el('products').textContent=report.length;el('average').textContent=money(orders.length?revenue/orders.length:0);el('rows').innerHTML=report.map((x,n)=>`<tr><td class="rank">${n+1}</td><td>${esc(x.name)}</td><td>${x.qty}</td><td class="amount">${money(x.income)}</td><td>${revenue?((x.income/revenue)*100).toFixed(1):0}%</td></tr>`).join('');el('bars').innerHTML=report.slice(0,8).map(x=>`<div class="bar-row"><div class="bar-head"><span>${esc(x.name)}</span><b>${x.qty}</b></div><div class="bar-track"><div class="bar-fill" style="width:${(x.qty/max)*100}%"></div></div></div>`).join('')||'<div class="empty">Sin ventas</div>';el('empty').classList.toggle('hidden',report.length>0)}
el('date').value=today();el('enter').onclick=signIn;el('password').onkeydown=e=>{if(e.key==='Enter')signIn()};el('refresh').onclick=load;el('period').onchange=load;el('date').onchange=load;el('exit').onclick=async()=>{await client.auth.signOut();location.reload()};client.auth.getSession().then(({data})=>{if(data.session)openApp().catch(async e=>{await client.auth.signOut();msg(e.message)})});
</script></body></html>
